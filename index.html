<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bannières - Software Craft Strasbourg</title>
    <meta name="description" content="Génération de bannières pour les meetups Software Craft Strasbourg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/lib/main.js"></script>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
<noscript id="deferred-styles">
    <link rel="stylesheet" href="/fonts/jetbrains-mono/JetbrainsMono.css">
    <link rel="stylesheet" href="/css/banner-rendering.css">
</noscript>
<main>
    <noscript>Activer Javascript pour utiliser cet outil</noscript>
    <section id="input-form">
        <h2 style="margin-top: 0;">Événement</h2>
        <button id="resetEventButton" class="mv-1">Réinitialiser</button>
        <div class="responsive-flexbox-grid">
            <div>
                <section class="section" aria-labelledby="eventInfo">
                    <h3 id="eventInfo" style="margin-top: 0;">Infos</h3>
                    <label for="eventTitle">Titre</label>
                    <input type="text" id="eventTitle" required>
                    <label for="eventSubtitle">Sous-titre</label>
                    <input type="text" id="eventSubtitle">
                </section>
                <!-- Sponsors are folded by default because we usually have the default one -->
                <details>
                    <summary>Sponsors</summary>
                    <section class="section" aria-labelledby="sponsorsInfos">
                        <h3 id="sponsorsInfos" style="margin-top: 0;">Sponsors</h3>
                        <label for="sponsorName">Nom</label>
                        <input type="text" id="sponsorName" required>
                        <label for="sponsorPhoto">Logo</label>
                        <input type="file" id="sponsorPhoto" accept="image/*" required>
                        <button id="addSponsorButton">Ajouter</button>
                        <h4 style="margin-top: 15px;">Sponsors courants</h4>
                        <div id="sponsorsList"><!-- Dynamic added sponsors rendered here --></div>
                    </section>
                </details>
            </div>

            <section class="section" aria-labelledby="speakersInfos">
                <h3 id="speakersInfos" style="margin-top: 0;">Speakers</h3>
                <label for="speakerName">Nom</label>
                <input type="text" id="speakerName" required>
                <label for="speakerPhoto">Photo</label>
                <input type="file" id="speakerPhoto" accept="image/*" required>
                <button id="addSpeakerButton">Ajouter</button>
                <h4 style="margin-top: 15px;">Speakers courants</h4>
                <div id="speakersList"><!-- Dynamic added speakers rendered here --></div>
            </section>
        </div>
    </section>

    <section id="preview-area">
        <h2 style="margin-top: 0;">Bannière</h2>
        <button id="exportBannerButton" class="mv-1">Exporter en image</button>
        <div id="banner-container"><!-- Banner content rendered here --></div>
    </section>
</main>
<footer><a href="https://github.com/swcraftstras/banner-generator">Code source</a> — Copyright 2026 Marc Bouvier —
    License MIT
</footer>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('SW registered:', registration);
                })
                .catch(registrationError => {
                    console.error('SW registration failed:', registrationError);
                });
        });
    }
</script>
<script defer>
    // Deferred loading of non-critical styles for first rendering
    const loadDeferredStyles = function() {
        const addStylesNode = document.getElementById("deferred-styles");
        const replacement = document.createElement("div");
        replacement.innerHTML = addStylesNode.textContent;
        document.body.appendChild(replacement)
        addStylesNode.parentElement.removeChild(addStylesNode);
    };
    const raf = window.requestAnimationFrame || window.mozRequestAnimationFrame ||
        window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;
    if (raf) raf(function() { window.setTimeout(loadDeferredStyles, 0); });
    else window.addEventListener('load', loadDeferredStyles);
</script>
</body>
</html>
